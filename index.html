<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Controles de salud infantil</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E2C74">
<meta name="description" content="Crecimiento con curvas OMS, enfermedades y registro dental">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Controles">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5F3F8; --surface:#FFFFFF; --surface2:#EFEBF4; --ink:#241E2D; --muted:#655D70; --line:#DED7E7;
  --plum:#5E2C74; --plum-ink:#FFFFFF; --plum-soft:#EADDF1;
  --teal:#0C6F79; --teal-soft:#D5ECEE;
  --amber:#8F5A05; --amber-soft:#F6E5C3;
  --rose:#A62E43; --rose-soft:#F7DCE1;
  --moss:#4A742F;
  --c-weight:#5E2C74; --c-height:#0C7F8A; --c-head:#B2740B; --c-bmi:#4F7F32; --c-wfl:#B03A5B;
  --band-mid:#E6E0EF; --band-lite:#F0ECF6; --band-faint:#F7F5FA;
  --ref:#8D839C; --ref-strong:#4E4560; --edge-a:#C99328; --edge-r:#C4485F;
  --tooth-out:#F3E9F8; --shadow:0 -6px 24px rgba(36,30,45,.08);
  --pc3:#9B1C31; --pc5:#D0563A; --pc10:#E9A24F; --pc25:#79BC68; --pc50:#2B6A3A;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121B; --surface:#211B29; --surface2:#2B2335; --ink:#EFEAF5; --muted:#A99FB5; --line:#3A3146;
    --plum:#C9A0DE; --plum-ink:#1A1220; --plum-soft:#3A2947;
    --teal:#6CC8D1; --teal-soft:#183B40;
    --amber:#E5B565; --amber-soft:#40311A;
    --rose:#F08CA0; --rose-soft:#43202A;
    --moss:#93C56E;
    --c-weight:#D2A9E6; --c-height:#59C4CF; --c-head:#E2A94A; --c-bmi:#9CCB77; --c-wfl:#EE8AA6;
    --band-mid:#2E2639; --band-lite:#262030; --band-faint:#211B29;
    --ref:#7D7290; --ref-strong:#BDB2CD; --edge-a:#C99328; --edge-r:#D96A80;
    --tooth-out:#3A2947; --shadow:0 -6px 24px rgba(0,0,0,.4);
    --pc3:#E0637A; --pc5:#EE8560; --pc10:#F0B865; --pc25:#8FD07F; --pc50:#5FBF7A;
  }
}
:root[data-theme="dark"]{
  --bg:#16121B; --surface:#211B29; --surface2:#2B2335; --ink:#EFEAF5; --muted:#A99FB5; --line:#3A3146;
  --plum:#C9A0DE; --plum-ink:#1A1220; --plum-soft:#3A2947;
  --teal:#6CC8D1; --teal-soft:#183B40;
  --amber:#E5B565; --amber-soft:#40311A;
  --rose:#F08CA0; --rose-soft:#43202A;
  --moss:#93C56E;
  --c-weight:#D2A9E6; --c-height:#59C4CF; --c-head:#E2A94A; --c-bmi:#9CCB77; --c-wfl:#EE8AA6;
  --band-mid:#2E2639; --band-lite:#262030; --band-faint:#211B29;
  --ref:#7D7290; --ref-strong:#BDB2CD; --edge-a:#C99328; --edge-r:#D96A80;
  --tooth-out:#3A2947; --shadow:0 -6px 24px rgba(0,0,0,.4);
  --pc3:#E0637A; --pc5:#EE8560; --pc10:#F0B865; --pc25:#8FD07F; --pc50:#5FBF7A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.15}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px;border-radius:6px}
#app{max-width:680px;margin:0 auto;padding:14px 16px 190px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.vh h1{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}

/* Buttons */
.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:44px;padding:0 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--ref)}
.btn.primary{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.danger{color:var(--rose);border-color:transparent;background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--plum)}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{appearance:none;border:0;background:transparent;color:var(--muted);width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface2)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card.tight{padding:12px 14px}
.card h3{margin-bottom:6px}
.stack>*+*{margin-top:12px}

/* Hero */
.hero{padding:6px 2px 18px}
.hero .who{display:flex;align-items:center;gap:6px}
.hero h1{font-size:34px}
.hero .age{font-family:var(--f-display);font-size:22px;font-weight:500;color:var(--plum);margin-top:2px}
.hero .last{margin-top:4px;color:var(--muted);font-size:14.5px}

/* Gauges */
.gauge-card{display:grid;grid-template-columns:1fr;gap:8px}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gauge-top .name{font-weight:600}
.gauge-top .val{font-family:var(--f-display);font-size:22px;font-weight:700;white-space:nowrap}
.gauge-top .val small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.gauge{position:relative;padding:8px 0 20px}
.track{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--rose-soft) 0 21.4%,var(--amber-soft) 21.4% 35.7%,var(--teal-soft) 35.7% 64.3%,var(--amber-soft) 64.3% 78.6%,var(--rose-soft) 78.6% 100%)}
.track .mk{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink)}
.gticks{position:absolute;left:0;right:0;top:26px;height:14px;font-size:11px;color:var(--muted)}
.gticks span{position:absolute;transform:translateX(-50%)}
.gauge-note{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.tone-ok{background:var(--teal-soft);color:var(--teal)}
.tone-watch{background:var(--amber-soft);color:var(--amber)}
.tone-alert{background:var(--rose-soft);color:var(--rose)}
.deltas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.delta{background:var(--surface2);border-radius:12px;padding:10px 12px}
.delta b{display:block;font-family:var(--f-display);font-size:19px}
.linkcard{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer}
.linkcard .t{font-weight:600}

/* Chips and segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;max-width:100%}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;min-height:36px;padding:0 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.segrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}

/* Chart */
.chartcard{padding:14px 12px 14px}
.chartcard h3{padding:0 4px}
.chartwrap{margin:6px 0 4px}
.chartwrap svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chartwrap text{font-family:var(--f-body);fill:var(--muted);font-size:11.5px}
.chartwrap .lbl{font-size:11px;font-weight:600}
.readout{background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:8px}
.readout .ro-main{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.readout .ro-val{font-family:var(--f-display);font-size:24px;font-weight:700}
.readout .ro-sub{margin:2px 0 8px;color:var(--muted);font-size:14.5px}
.note{font-size:13.5px;color:var(--muted);padding:0 4px;margin:6px 0 14px}

/* Controls list */
.ctl{width:100%;text-align:left;cursor:pointer;display:block;appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;color:inherit}
.ctl:hover{border-color:var(--ref)}
.ctl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px}
.ctl .date{font-weight:700}
.ctl .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctl .col .n{font-family:var(--f-display);font-weight:700;font-size:19px}
.ctl .col .n small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);margin-left:2px}
.ctl .col .pill{margin-top:3px;font-size:12px;padding:1px 8px}
.ctl .flag{margin-top:8px;font-size:13px;color:var(--amber)}
.ctl .nt{margin-top:8px;font-size:14px;color:var(--muted)}
.dataactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* Health */
.ep{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ep>summary{list-style:none;cursor:pointer;padding:14px;display:block}
.ep>summary::-webkit-details-marker{display:none}
.ep .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ep .h b{font-family:var(--f-display);font-size:18px}
.ep .sub{color:var(--muted);font-size:14px;margin-top:2px}
.ep .meds-line{margin-top:6px;font-size:14.5px}
.ep .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.ep .body>*{margin-top:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface2);border-radius:8px;padding:3px 9px;font-size:13.5px}
.med{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 12px;background:var(--surface2);border-radius:12px}
.med b{font-weight:700}
.active{border-color:var(--amber);background:var(--amber-soft)}
.active h3{color:var(--amber)}

/* Teeth */
.arch{display:grid;grid-template-columns:repeat(5,1fr) 12px repeat(5,1fr);gap:4px;align-items:start}
.tooth{appearance:none;border:0;background:transparent;padding:2px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;color:var(--muted);min-height:48px}
.tooth svg{width:100%;max-width:34px;height:auto;overflow:visible}
.tooth.low svg{transform:scaleY(-1)}
.tooth .num{font-size:11px;font-weight:600}
.tooth path.shape{fill:transparent;stroke:var(--ref);stroke-width:1.6;stroke-dasharray:3 3}
.tooth.out path.shape{fill:var(--tooth-out);stroke:var(--plum);stroke-width:2;stroke-dasharray:none}
.tooth.out .num{color:var(--plum)}
.tooth.lost path.shape{fill:transparent;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:1 4;stroke-linecap:round}
.tooth.lost{opacity:.6}
.tooth .dot{position:absolute;top:0;right:2px;width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid var(--surface)}
.jaw{margin-bottom:6px}
.jawlabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:2px 2px 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.progress{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--plum);border-radius:99px}
.next{background:var(--teal-soft);border-radius:14px;padding:12px 14px;margin-bottom:10px;color:var(--teal);font-weight:600}

/* Nav */
nav.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:4px 6px}
nav.bar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.bar button{appearance:none;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;font-size:11.5px;font-weight:600;cursor:pointer;min-height:52px;border-radius:12px}
nav.bar button .ic{width:52px;height:30px;border-radius:99px;display:grid;place-items:center}
nav.bar button[aria-current="page"]{color:var(--plum)}
nav.bar button[aria-current="page"] .ic{background:var(--plum-soft)}
nav.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.scrim{position:absolute;inset:0;background:rgba(20,14,28,.5)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:680px;max-height:80%;overflow-y:auto;border-radius:22px;padding:14px 16px 22px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet .grab{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .grab h2{font-size:22px}
.fld{display:block;font-weight:600;font-size:14.5px;margin-bottom:12px}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:5px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:46px;font-weight:400;font-size:16px}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:3px solid var(--plum-soft);border-color:var(--plum)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.actions .primary{flex:1}
.err{color:var(--rose);font-size:14px;min-height:0;margin-bottom:6px}
.preview{display:grid;gap:6px;margin:2px 0 12px}
.preview .line{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14.5px;background:var(--surface2);border-radius:10px;padding:6px 10px}
.medrow{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface)}
.medrow .fld{margin-bottom:8px}
.medrow .rm{float:right}
.sect{font-family:var(--f-display);font-weight:700;font-size:17px;margin:18px 0 8px}
.empty{text-align:center;padding:26px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:19px;margin-bottom:4px}
.empty .btn{margin-top:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(72px + env(safe-area-inset-top,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.load{padding:80px 0;text-align:center;color:var(--muted)}

/* Leyenda de líneas y tablas */
.plegend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 4px;margin:8px 0 2px;font-size:13px;color:var(--muted)}
.plegend span{display:inline-flex;align-items:center;gap:5px}
.plegend i{display:inline-block;width:16px;height:4px;border-radius:2px}
.plegend i.dot{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
table.rep{border-collapse:collapse;width:100%;min-width:540px;font-size:14px}
table.rep th,table.rep td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
table.rep thead th{background:var(--surface2);font-family:var(--f-display);font-weight:700;font-size:14px}
table.rep tbody th{position:sticky;left:0;background:var(--surface);text-align:left;font-weight:600;z-index:1;border-right:1px solid var(--line)}
table.rep thead th:first-child{position:sticky;left:0;z-index:2;text-align:left}
table.rep tr.yr th{background:var(--surface2);font-size:12.5px;color:var(--muted);text-align:left;position:static;border-right:0}
table.rep tbody tr:last-child td,table.rep tbody tr:last-child th{border-bottom:0}
table.rep .sub{display:block;font-weight:400;font-size:12px;color:var(--muted)}
table.rep .u{color:var(--muted);font-size:12px}
table.rep .pc{display:block;font-size:12.5px;font-weight:700}
table.rep .na{color:var(--muted)}
.t-ok{color:var(--teal)} .t-watch{color:var(--amber)} .t-alert{color:var(--rose)}
.print-only,#printroot{display:none}
#printroot h1{font-size:22px;margin-bottom:2px}
#printroot h2{font-size:16px;margin:18px 0 6px}
#printroot .pchart{break-inside:avoid;page-break-inside:avoid;margin-bottom:10px}
#printroot .pchart svg{width:100%;max-width:520px;height:auto;display:block}
#printroot .pchart text{font-size:11px;fill:#444}
@media print{
  html,body{background:#fff!important;color:#000!important}
  :root{padding:0}
  body.printing #app,body.printing nav.bar,body.printing #toast{display:none!important}
  body.printing #printroot{display:block}
  #printroot table.rep{min-width:0;font-size:10.5px}
  #printroot .tablewrap{border:0;overflow:visible}
  @page{margin:14mm}
}
body.locked nav.bar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<nav class="bar" aria-label="Secciones"><div class="in" id="nav"></div></nav>
<div id="app" aria-live="polite"><div class="load">Cargando...</div></div>
<div id="toast" role="status"></div>
<noscript>Esta app necesita JavaScript.</noscript>

<script type="module">
/* ============================================================
   Datos OMS: patrones de crecimiento infantil 2006, niñas 0 a 5 años.
   Parámetros LMS. x0 = primer valor de x, step = paso entre filas.
   len/bmiL: longitud (acostada) 0 a 24 meses. hgt/bmiH: estatura (de pie) 24 a 60 meses.

const fixed = (v, d) => (v == null || isNaN(v)) ? '' : Number(v).toLocaleString('es-CL', {minimumFractionDigits: d, maximumFractionDigits: d});
const num = s => { if (s == null) return null; const t = String(s).replace(/[^0-9,.\-]/g, '').replace(',', '.'); if (t === '') return null; const v = parseFloat(t); return isNaN(v) ? null : v; };
const F = (f, n) => f.elements.namedItem(n);
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const UT = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fmtDate = (iso, o) => iso ? new Intl.DateTimeFormat('es-CL', Object.assign({day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'}, o)).format(UT(iso)) : '';
const daysBetween = (a, b) => Math.round((UT(b) - UT(a)) / 86400000);
const ageMonths = (birth, date) => (UT(date) - UT(birth)) / 86400000 / 30.4375;
function ageText(birth, date) {
  const b = birth.split('-').map(Number), d = date.split('-').map(Number);
  let months = (d[0] - b[0]) * 12 + (d[1] - b[1]), days = d[2] - b[2];
  if (days < 0) { months--; days += new Date(Date.UTC(d[0], d[1] - 1, 0)).getUTCDate(); }
  if (months < 0) return '0 días';
  if (months === 0) return days === 1 ? '1 día' : days + ' días';
  if (months < 24) return months === 1 ? '1 mes' : months + ' meses';
  const y = Math.floor(months / 12), m = months % 12;
  return m ? `${y} años ${m} ${m === 1 ? 'mes' : 'meses'}` : `${y} años`;
}
function timeAgo(iso) {
  const n = daysBetween(iso, todayISO());
  if (n <= 0) return 'hoy';
  if (n === 1) return 'ayer';
  if (n < 45) return `hace ${n} días`;
  const m = Math.round(n / 30.4375);
  if (m < 24) return `hace ${m} meses`;
  return `hace ${Math.floor(m / 12)} años`;
}

/* ---------- Matemática OMS ---------- */
function lmsAt(tab, x) {
  const n = tab.d.length - 1, i = (x - tab.x0) / tab.step;
  if (i < -1e-9 || i > n + 1e-9) return null;
  const lo = Math.min(Math.max(Math.floor(i), 0), n - 1), f = i - lo, a = tab.d[lo], b = tab.d[lo + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
const zOf = (y, [L, M, S]) => L === 0 ? Math.log(y / M) / S : (Math.pow(y / M, L) - 1) / (L * S);
const valAtZ = (z, [L, M, S]) => L === 0 ? M * Math.exp(S * z) : M * Math.pow(1 + L * S * z, 1 / L);
function phi(z) {
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z / 2);
  return z >= 0 ? 0.5 * (1 + y) : 0.5 * (1 - y);
}
const pctText = p => p < 1 ? '<1' : p > 99 ? '>99' : String(Math.round(p));
function zone(z) {
  if (z >= 3) return {label: 'Muy por sobre lo esperado', tone: 'alert'};
  if (z >= 2) return {label: 'Por sobre lo esperado', tone: 'alert'};
  if (z >= 1) return {label: 'Algo sobre el promedio', tone: 'watch'};
  if (z > -1) return {label: 'Dentro de lo esperado', tone: 'ok'};
  if (z > -2) return {label: 'Algo bajo el promedio', tone: 'watch'};
  if (z > -3) return {label: 'Por debajo de lo esperado', tone: 'alert'};
  return {label: 'Muy por debajo de lo esperado', tone: 'alert'};
}

const IND = [
  {id: 'wfa', name: 'Peso para la edad', short: 'Peso', unit: 'kg', dec: 2, color: 'var(--c-weight)', kind: 'age'},
  {id: 'lhfa', name: 'Talla para la edad', short: 'Talla', unit: 'cm', dec: 1, color: 'var(--c-height)', kind: 'age'},
  {id: 'wfl', name: 'Peso para la talla', short: 'Peso/talla', unit: 'kg', dec: 2, color: 'var(--c-wfl)', kind: 'len'},
  {id: 'bmifa', name: 'IMC para la edad', short: 'IMC', unit: 'kg/m²', dec: 1, color: 'var(--c-bmi)', kind: 'age'},
  {id: 'hcfa', name: 'Perímetro de la cabeza', short: 'Cabeza', unit: 'cm', dec: 1, color: 'var(--c-head)', kind: 'age'},
];
const INDX = Object.fromEntries(IND.map(i => [i.id, i]));
function tabFor(ind, a) {
  switch (ind.id) {
    case 'wfa': return WHO.wfa;
    case 'lhfa': return a < 24 ? WHO.len : WHO.hgt;
    case 'hcfa': return WHO.hc;
    case 'bmifa': return a < 24 ? WHO.bmiL : WHO.bmiH;
    case 'wfl': return a < 24 ? WHO.wfl : WHO.wfh;
  }
}
function valueOf(ind, m) {
  switch (ind.id) {
    case 'wfa': case 'wfl': return m.weight;
    case 'lhfa': return m.height;
    case 'hcfa': return m.head;
    case 'bmifa': return (m.weight && m.height) ? m.weight / Math.pow(m.height / 100, 2) : null;
  }
}
function evalPoint(ind, m, birth) {
  const v = valueOf(ind, m);
  if (v == null || isNaN(v) || !birth || !m.date) return null;
  const a = ageMonths(birth, m.date), x = ind.kind === 'len' ? m.height : a;
  if (x == null || isNaN(x)) return null;
  let lms = null;
  const days = (UT(m.date) - UT(birth)) / 86400000;
  if (ind.kind === 'age' && days <= 91) {   /* menores de 13 semanas: tablas semanales de la OMS */
    const tw = {wfa: WHO.wfaW, lhfa: WHO.lenW, hcfa: WHO.hcW, bmifa: WHO.bmiW}[ind.id];
    lms = lmsAt(tw, days / 7);
  } else lms = lmsAt(tabFor(ind, a), x);
  if (!lms) return null;
  const z = zOf(v, lms);
  return {id: m.id, date: m.date, v, x, age: a, z, p: phi(z) * 100};
}

const RANGES = {'0-5': [0, 60], '0-3': [0, 36], '0-2': [0, 24], '2-5': [24, 60]};

function segmentsFor(ind, o) {

/* Dientes */
const TOOTH_TYPES = [
  {k: 'ci', n: 'Incisivo central', r: {u: [8, 12], l: [6, 10]}, shape: 'inc'},
  {k: 'li', n: 'Incisivo lateral', r: {u: [9, 13], l: [10, 16]}, shape: 'inc'},
  {k: 'c', n: 'Canino', r: {u: [16, 22], l: [17, 23]}, shape: 'can'},
  {k: 'm1', n: 'Primer molar', r: {u: [13, 19], l: [14, 18]}, shape: 'mol'},
  {k: 'm2', n: 'Segundo molar', r: {u: [25, 33], l: [23, 31]}, shape: 'mol'},
];
const SHAPES = {
  inc: 'M11 4h18c2.500 0 4 1.500 4 4v22c0 8-4 15-13 15S7 38 7 30V8c0-2.500 1.500-4 4-4z',
  can: 'M9 4h22c2 0 3.500 1.500 3.500 4v20c0 9-8 19-14.500 19S5.500 37 5.500 28V8C5.500 5.500 7 4 9 4z',
  mol: 'M4 7c0-2.500 2-4 4.500-4h23C34 3 36 4.500 36 7v25c0 5-2.500 9-5.500 9-2.500 0-3.500-3-6-3s-3 5-4.500 5-2-5-4.500-5-3.500 3-6 3C6.500 41 4 37 4 32z',
};
function toothInfo(code) {
  const q = +code[0], pos = +code[1], upper = q === 5 || q === 6, right = q === 5 || q === 8;
  const t = TOOTH_TYPES[pos - 1];
  return {code, upper, right, type: t, name: `${t.n} ${upper ? 'superior' : 'inferior'} ${right ? 'derecho' : 'izquierdo'}`, range: upper ? t.r.u : t.r.l};
}
const ARCH_UP = ['55', '54', '53', '52', '51', '61', '62', '63', '64', '65'];
const ARCH_LO = ['85', '84', '83', '82', '81', '71', '72', '73', '74', '75'];
function archHTML(codes, low) {
  const cell = code => {
    const t = S.teeth[code], info = toothInfo(code), cls = t ? (t.st === 'lost' ? 'lost' : 'out') : '';
    const desc = `${info.name}, ${t ? (t.st === 'lost' ? 'se cayó' : 'ya salió') : 'aún no sale'}`;
    return `<button class="tooth ${low ? 'low' : ''} ${cls}" data-act="tooth" data-code="${code}" aria-label="${desc}"><svg viewBox="0 0 40 52" aria-hidden="true"><path class="shape" d="${SHAPES[info.type.shape]}"/></svg><span class="num">${code}</span>${t && t.note ? '<i class="dot"></i>' : ''}</button>`;
  };
  return `<div class="arch">${codes.slice(0, 5).map(cell).join('')}<span></span>${codes.slice(5).map(cell).join('')}</div>`;
}
function vDientes() {

    <input type="file" id="file" accept=".csv,.json,text/csv,application/json" class="sr" tabindex="-1">`);
  $('#f-profile', w).addEventListener('submit', ev => {
    ev.preventDefault(); const f = ev.target;
    S.profile = {name: F(f,'name').value.trim(), birth: F(f,'birth').value, sex: 'F'}; closeSheet(); saveProfile();
  });
}

function measureFromForm(f) { return {date: F(f,'date').value, weight: num(F(f,'weight').value), height: num(F(f,'height').value), head: num(F(f,'head').value), notes: F(f,'notes').value.trim()}; }
function updatePreview(f) {
  const m = measureFromForm(f), b = birth(), out = [];
  if (b && m.date) IND.forEach(ind => { const e = evalPoint(ind, Object.assign({id: 'x'}, m), b); if (e) { const zn = zone(e.z); out.push(`<div class="line"><span>${ind.name}: <b>${fixed(e.v, ind.dec)} ${ind.unit}</b></span><span class="pill tone-${zn.tone}">P${pctText(e.p)}</span></div>`); } });
  $('#preview').innerHTML = out.join('');
}
function openControl(id) {
  const m = id ? S.measurements.find(x => x.id === id) : null, b = birth();
  const w = openSheet(m ? 'Editar control' : 'Nuevo control', `<form id="f-control" autocomplete="off">
    <label class="fld">Fecha<input type="date" name="date" required min="${b}" max="${todayISO()}" value="${m ? m.date : todayISO()}"></label>
    <div class="row3"><label class="fld">Peso (kg)<input name="weight" inputmode="decimal" placeholder="13,7" value="${m && m.weight != null ? fmt(m.weight, 3) : ''}"></label>
    <label class="fld">Talla (cm)<input name="height" inputmode="decimal" placeholder="95" value="${m && m.height != null ? fmt(m.height, 1) : ''}"></label>
    <label class="fld">Cabeza (cm)<input name="head" inputmode="decimal" placeholder="49" value="${m && m.head != null ? fmt(m.head, 1) : ''}"></label></div>
    <label class="fld">Notas<textarea name="notes" rows="2" placeholder="Opcional">${m ? esc(m.notes || '') : ''}</textarea></label>
    <div id="preview" class="preview" aria-live="polite"></div><div class="err" id="ferr"></div>
    <div class="actions"><button class="btn primary" type="submit">Guardar control</button>${m ? '<button type="button" class="btn danger" data-act="ask-del">Eliminar</button>' : ''}</div></form>`);
  const f = $('#f-control', w); updatePreview(f);
  f.addEventListener('input', () => updatePreview(f));
  f.addEventListener('submit', ev => {
    ev.preventDefault(); const v = measureFromForm(f), er = $('#ferr', w);
    if (v.weight == null && v.height == null && v.head == null) { er.textContent = 'Ingresa al menos peso, talla o perímetro de la cabeza.'; return; }
    if (v.weight != null && (v.weight < 1 || v.weight > 40)) { er.textContent = 'El peso debe estar entre 1 y 40 kg.'; return; }
    if (v.height != null && (v.height < 30 || v.height > 130)) { er.textContent = 'La talla debe estar entre 30 y 130 cm.'; return; }
    if (v.head != null && (v.head < 25 || v.head > 60)) { er.textContent = 'El perímetro de la cabeza debe estar entre 25 y 60 cm.'; return; }
    if (b && v.date < b) { er.textContent = 'La fecha es anterior al nacimiento.'; return; }
    closeSheet(); S._keepScroll = true; saveDoc('measurements', Object.assign({id: m ? m.id : uid('m')}, v)); toast('Control guardado');
  });
  const del = $('[data-act="ask-del"]', w);
  if (del) del.addEventListener('click', () => askDelete(del, '¿Eliminar este control?', () => { delDoc('measurements', m.id); toast('Control eliminado'); }), {once: true});
}

const SYMPTOMS = ['Fiebre', 'Tos', 'Mocos', 'Congestión', 'Dolor de garganta', 'Dolor de oídos', 'Vómitos', 'Diarrea', 'Dolor de estómago', 'Erupción en la piel', 'Decaimiento', 'Inapetencia', 'Dificultad para respirar'];
const ILLNESSES = ['Resfrío común', 'Influenza', 'Faringoamigdalitis', 'Otitis', 'Bronquitis obstructiva', 'Bronquiolitis', 'Neumonía', 'Gastroenteritis', 'Infección urinaria', 'Conjuntivitis', 'Varicela', 'Mano, pie y boca', 'Exantema súbito', 'Laringitis', 'COVID-19', 'Alergia'];
const MEDS = ['Paracetamol', 'Ibuprofeno', 'Amoxicilina', 'Amoxicilina con ácido clavulánico', 'Azitromicina', 'Cefadroxilo', 'Salbutamol', 'Budesonida', 'Prednisona', 'Prednisolona', 'Loratadina', 'Cetirizina', 'Suero fisiológico nasal', 'Suero de rehidratación oral', 'Ondansetrón', 'Zinc'];
function medRow(m) {
  m = m || {};
  return `<div class="medrow"><button type="button" class="btn danger sm rm" data-act="rm-med" aria-label="Quitar medicamento">Quitar</button>
    <label class="fld">Medicamento<input name="mname" list="dl-meds" value="${esc(m.name)}" placeholder="Ej: Paracetamol"></label>
    <div class="row2"><label class="fld">Dosis<input name="mdose" value="${esc(m.dose)}" placeholder="Ej: 5 ml"></label>

    <label class="fld">Indicación<input name="mnotes" value="${esc(m.notes)}" placeholder="Ej: con comida"></label></div></div>`;
}
function openIllness(id) {
  const e = id ? S.illnesses.find(x => x.id === id) : null;
  const sel = new Set(e ? e.symptoms || [] : []);
  const w = openSheet(e ? 'Editar enfermedad' : 'Nueva enfermedad', `<form id="f-ill" autocomplete="off">
    <label class="fld">Diagnóstico o motivo<input name="name" required list="dl-ill" value="${e ? esc(e.name) : ''}" placeholder="Ej: Otitis"></label>
    <div class="row2"><label class="fld">Desde<input type="date" name="start" required max="${todayISO()}" min="${birth()}" value="${e ? e.start : todayISO()}"></label>
    <label class="fld">Hasta<input type="date" name="end" min="${birth()}" value="${e && e.end ? e.end : ''}"></label></div>
    <p class="tiny muted" style="margin:-6px 0 12px">Deja "Hasta" vacío mientras siga en curso.</p>
    <div class="sect" style="margin-top:4px">Síntomas</div><div class="chips" style="flex-wrap:wrap;overflow:visible;margin:0 0 10px;padding:0" id="sym">${SYMPTOMS.concat([...sel].filter(s => !SYMPTOMS.includes(s))).map(s => `<button type="button" class="chip" aria-pressed="${sel.has(s)}" data-act="sym">${esc(s)}</button>`).join('')}</div>
    <div class="row2"><label class="fld">Temperatura máxima (°C)<input name="temp" inputmode="decimal" placeholder="38,5" value="${e && e.temp ? fmt(e.temp, 1) : ''}"></label>
    <label class="fld">Atendida en<input name="place" value="${e ? esc(e.place) : ''}" placeholder="Médico o centro"></label></div>
    <div class="sect">Medicamentos indicados</div>
    <p class="tiny muted" style="margin:-4px 0 8px">Anota la dosis tal como la indicó el médico.</p>
    <div id="meds">${(e && e.meds && e.meds.length ? e.meds : []).map(medRow).join('')}</div>
    <button type="button" class="btn sm" data-act="add-med" style="margin-bottom:14px">${ICON.plus}Agregar medicamento</button>
    <label class="fld">Observaciones<textarea name="notes" rows="3" placeholder="Evolución, reposo, control pendiente...">${e ? esc(e.notes || '') : ''}</textarea></label>
    <datalist id="dl-ill">${ILLNESSES.map(x => `<option value="${esc(x)}">`).join('')}</datalist><datalist id="dl-meds">${MEDS.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    <div class="err" id="ferr"></div>
    <div class="actions"><button class="btn primary" type="submit">Guardar</button>${e ? '<button type="button" class="btn danger" data-act="ask-del">Eliminar</button>' : ''}</div></form>`);
  const f = $('#f-ill', w);
  f.addEventListener('submit', ev => {
    ev.preventDefault(); const er = $('#ferr', w);
    const end = F(f,'end').value || '';
    if (end && end < F(f,'start').value) { er.textContent = 'La fecha de término es anterior al inicio.'; return; }
    const meds = $$('.medrow', w).map(r => ({name: $('[name=mname]', r).value.trim(), dose: $('[name=mdose]', r).value.trim(), freq: $('[name=mfreq]', r).value.trim(), days: num($('[name=mdays]', r).value), notes: $('[name=mnotes]', r).value.trim()})).filter(m => m.name);
    const obj = {id: e ? e.id : uid('i'), name: F(f,'name').value.trim(), start: F(f,'start').value, end, symptoms: $$('#sym .chip[aria-pressed="true"]', w).map(b => b.textContent), temp: num(F(f,'temp').value), place: F(f,'place').value.trim(), notes: F(f,'notes').value.trim(), meds};
    closeSheet(); saveDoc('illnesses', obj); toast('Episodio guardado');
  });
  const del = $('[data-act="ask-del"]', w);
  if (del) del.addEventListener('click', () => askDelete(del, '¿Eliminar este episodio?', () => { delDoc('illnesses', e.id); toast('Episodio eliminado'); }), {once: true});
}

function openTooth(code) {
  const info = toothInfo(code), t = S.teeth[code] || {st: '', date: '', note: ''}, b = birth();
  const w = openSheet(`Diente ${code}`, `<form id="f-tooth" autocomplete="off"><p style="font-weight:600;margin-bottom:2px">${info.name}</p>
    <p class="small muted" style="margin-bottom:14px">Suele salir entre los ${info.range[0]} y ${info.range[1]} meses. Cada niña tiene su propio ritmo.</p>
    <div class="segrow" id="tst"><div class="seg" role="group" style="width:100%">${[['', 'Aún no'], ['out', 'Ya salió'], ['lost', 'Se cayó']].map(([v, l]) => `<button type="button" style="flex:1" aria-pressed="${(t.st || '') === v}" data-act="tst" data-v="${v}">${l}</button>`).join('')}</div></div>
    <div id="tdate"><label class="fld"><span id="tdlab">Fecha</span><input type="date" name="date" min="${b}" max="${todayISO()}" value="${esc(t.date)}"></label><p class="small muted" id="tage" style="margin:-6px 0 12px"></p></div>
    <label class="fld">Tratamiento u observación<textarea name="note" rows="2" placeholder="Ej: mancha blanca, obturación, golpe...">${esc(t.note)}</textarea></label>
    <div class="actions"><button class="btn primary" type="submit">Guardar</button></div></form>`);
  const f = $('#f-tooth', w); let st = t.st || '';
  const sync = () => {
    $('#tdate', w).style.display = st ? '' : 'none';
    $('#tdlab', w).textContent = st === 'lost' ? 'Fecha en que se cayó' : 'Fecha en que salió';
    const d = F(f,'date').value; $('#tage', w).textContent = (st && d && b) ? `Tenía ${ageText(b, d)}.` : '';
    $$('#tst button', w).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === st)));
  };
  w.addEventListener('click', ev => { const bt = ev.target.closest('[data-act="tst"]'); if (bt) { st = bt.dataset.v; sync(); } });
  F(f,'date').addEventListener('input', sync); sync();
  f.addEventListener('submit', ev => {
    ev.preventDefault();
    const note = F(f,'note').value.trim();
    if (!st && !note) delete S.teeth[code]; else S.teeth[code] = {st: st || 'none', date: st ? F(f,'date').value : '', note};
    if (S.teeth[code] && S.teeth[code].st === 'none') S.teeth[code].st = '';
    closeSheet(); S._keepScroll = true; saveTeeth(); toast('Diente guardado');
  });
}
const VTYPES = ['Control', 'Limpieza', 'Barniz de flúor', 'Caries u obturación', 'Urgencia', 'Otro'];
function openVisit(id) {
  const v = id ? S.visits.find(x => x.id === id) : null;
  const w = openSheet(v ? 'Editar visita' : 'Nueva visita dental', `<form id="f-visit" autocomplete="off">
    <label class="fld">Fecha<input type="date" name="date" required min="${birth()}" value="${v ? v.date : todayISO()}"></label>
    <label class="fld">Motivo<select name="type">${VTYPES.map(t => `<option ${v && v.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    <label class="fld">Dentista o centro<input name="place" value="${v ? esc(v.place) : ''}"></label>
    <label class="fld">Qué se hizo o qué indicó<textarea name="notes" rows="3">${v ? esc(v.notes || '') : ''}</textarea></label>
    <label class="fld">Próxima cita (opcional)<input type="date" name="next" value="${v && v.next ? v.next : ''}"></label>
    <div class="actions"><button class="btn primary" type="submit">Guardar</button>${v ? '<button type="button" class="btn danger" data-act="ask-del">Eliminar</button>' : ''}</div></form>`);
  const f = $('#f-visit', w);
  f.addEventListener('submit', ev => {
    ev.preventDefault();
    closeSheet(); saveDoc('visits', {id: v ? v.id : uid('v'), date: F(f,'date').value, type: F(f,'type').value, place: F(f,'place').value.trim(), notes: F(f,'notes').value.trim(), next: F(f,'next').value || ''}); toast('Visita guardada');
  });
  const del = $('[data-act="ask-del"]', w);
  if (del) del.addEventListener('click', () => askDelete(del, '¿Eliminar esta visita?', () => { delDoc('visits', v.id); toast('Visita eliminada'); }), {once: true});
}

/* ---------- Exportar e importar ---------- */
function csvQuote(s) { return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCSV() {
  const p = S.profile || {}, cm = (v, u, d) => v == null ? '' : csvQuote(fmt(v, d) + ' ' + u);
  const rows = [`(N) Nombre,${csvQuote(p.name || '')},,,`, `(B) Fecha de nacimiento,${p.birth || ''},,,`, '(G) Sexo,F,,,', '(P) Foto,,,,', ',,,,', 'Fecha,Peso,Estatura,Circunferencia de la cabeza,Notas']
    .concat(sortedM().map(m => [m.date, cm(m.weight, 'kg', 3), cm(m.height, 'cm', 1), cm(m.head, 'cm', 1), csvQuote(m.notes || '')].join(',')));
  return rows.join('\n') + '\n';
}
async function saveFile(name, data) {
  if (S.dl) { try { await S.dl.save({filename: name, data}); return; } catch (e) { if (e && e.code === 'declined') return; } }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data])); a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { toast('No se pudo descargar el archivo.'); }
}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; } else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
const fixMoji = s => { if (/[ÃÂ]/.test(s)) { try { return decodeURIComponent(escape(s)); } catch (e) {} } return s; };
async function importText(text) {
  text = text.replace(/^\uFEFF/, '');
  let added = 0, updated = 0;
  if (text.trim().startsWith('{')) {
    const j = JSON.parse(text);
    if (j.profile) S.profile = j.profile;
    (j.measurements || []).forEach(m => upsert(S.measurements, m)); (j.illnesses || []).forEach(m => upsert(S.illnesses, m)); (j.visits || []).forEach(m => upsert(S.visits, m));
    if (j.teeth) Object.assign(S.teeth, j.teeth);
    if (DB) { if (S.profile) await dbSet('profile/main', S.profile); for (const c of ['measurements', 'illnesses', 'visits']) for (const o of S[c]) await dbSet(c + '/' + o.id, o); await dbSet('teeth/all', {map: S.teeth}); } else lsSave();
    render(); toast('Copia importada'); return;
  }
  const rows = parseCSV(text); let name = null, bd = null, inTable = false; const list = [];
  for (const r of rows) {
    const k = (r[0] || '').trim();
    if (/^\(N\)/.test(k)) name = fixMoji((r[1] || '').trim()); else if (/^\(B\)/.test(k)) bd = (r[1] || '').trim(); else if (/^fecha$/i.test(k)) inTable = true;
    else if (inTable && /^\d{4}-\d{2}-\d{2}$/.test(k)) list.push({date: k, weight: num(r[1]), height: num(r[2]), head: num(r[3]), notes: fixMoji((r[4] || '').trim())});
  }
  if (!list.length) { toast('No encontré controles en ese archivo.'); return; }
  if (!S.profile && bd) { S.profile = {name: name || '', birth: bd, sex: 'F'}; if (DB) await dbSet('profile/main', S.profile); }
  for (const m of list) {
    const ex = S.measurements.find(x => x.date === m.date);
    if (ex) { Object.assign(ex, m); updated++; if (DB) await dbSet('measurements/' + ex.id, ex); }
    else { const o = Object.assign({id: uid('m')}, m); S.measurements.push(o); added++; if (DB) await dbSet('measurements/' + o.id, o); }
  }
  if (!DB) lsSave(); render(); toast(`Importados ${added} controles nuevos, ${updated} actualizados`);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'tab': S.tab = el.dataset.tab; window.scrollTo(0, 0); render(); break;
    case 'close': closeSheet(); break;
    case 'login': loginGoogle(); break;
    case 'logout': logout(); break;
    case 'profile': openProfile(false); break;
    case 'new-control': openControl(); break;
    case 'edit-control': openControl(el.dataset.id); break;
    case 'new-ill': openIllness(); break;
    case 'edit-ill': openIllness(el.dataset.id); break;
    case 'new-visit': openVisit(); break;
    case 'edit-visit': openVisit(el.dataset.id); break;
    case 'tooth': openTooth(el.dataset.code); break;
    case 'all-teeth': ARCH_UP.concat(ARCH_LO).forEach(c => { if (!S.teeth[c]) S.teeth[c] = {st: 'out', date: '', note: ''}; }); S._keepScroll = true; saveTeeth(); toast('Dientes marcados'); break;
    case 'ind': {
      const i = INDX[el.dataset.ind]; S.chart.ind = i.id;
      if (i.kind === 'len') { const l = latestFor(i); S.chart.range = (l && l.age >= 24) ? '2-5' : '0-2'; }
      else S.chart.range = defaultAgeRange();
      S.chart.sel = null; S._keepScroll = true; render(); break;
    }
    case 'ctlview': S.ctlView = el.dataset.v; S._keepScroll = true; render(); break;
    case 'tbl': S.tbl = el.dataset.t; S._keepScroll = true; render(); break;
    case 'export-report': saveFile('reporte-crecimiento.csv', exportReportCSV()); break;
    case 'print': printReport(); break;
    case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt.userChoice.finally(() => { S.installEvt = null; render(); }); } break;
    case 'mode': S.chart.mode = el.dataset.mode; S._keepScroll = true; render(); break;
    case 'range': S.chart.range = el.dataset.range; S.chart.sel = null; S._keepScroll = true; render(); break;
    case 'sym': el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')); break;
    case 'add-med': { const c = $('#meds'); c.insertAdjacentHTML('beforeend', medRow()); const last = c.lastElementChild; $('input', last).focus(); } break;
    case 'rm-med': el.closest('.medrow').remove(); break;
    case 'export-csv': saveFile('controles.csv', exportCSV()); break;
    case 'export-json': saveFile('copia-completa.json', JSON.stringify({profile: S.profile, measurements: S.measurements, illnesses: S.illnesses, visits: S.visits, teeth: S.teeth}, null, 1)); break;
    case 'import': case 'import-first': { const f = $('#file'); if (f) f.click(); } break;
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id !== 'file') return;
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => { try { closeSheet(); await importText(String(r.result)); } catch (e) { console.error(e); toast('No se pudo leer el archivo.'); } };
  r.readAsText(f, 'utf-8'); ev.target.value = '';
});
window.addEventListener('pointerup', () => { chartDown = false; });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });

window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); S.installEvt = ev; if (S.auth === 'in' && S.tab === 'controles') render(); });
window.addEventListener('appinstalled', () => { S.installEvt = null; });
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e)));
render();
boot();
</script>
